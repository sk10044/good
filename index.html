
<!DOCTYPE html>
<html lang="ko">
<head>

  <title>정보공유방</title>

    body {

    }
    .container {
      position: relative;
      width: 100%;

      margin: 0 auto;
    }
    .main-image {

    }
    .link-btn {

      top: 240px; left: 530px;
      width: 230px; height: 60px;
    }
    /* 아래 버튼 */
    .bottom-btn {
      bottom: 50px; left: 450px;
      width: 280px; height: 70px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 이미지 -->
    <img src="홈페이지메인.jpg" alt="정보공유방 메인" class="main-image">

    <!-- 중간 링크 -->
    <a href="http://sk10044.com" class="link-btn middle-btn" target="_blank"></a>

    <!-- 하단 링크 -->
    <a href="http://sk10044.com" class="link-btn bottom-btn" target="_blank"></a>
  </div>
</body>
</html>
