
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>정보공유방</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background-color: #000;
    }
    .container {
      position: relative;
      width: 100%;
      max-width: 1189px;
      margin: 0 auto;
    }
    .main-image {
      width: 100%;
      height: auto;
      display: block;
    }
    .link-btn {
      position: absolute;
      display: block;
      z-index: 10;
    }
    .middle-btn {
      top: 20.2%;
      left: 44.6%;
      width: 19.3%;
      height: 5.3%;
    }
    .bottom-btn {
      bottom: 4.2%;
      left: 37.8%;
      width: 23.5%;
      height: 6.2%;
    }

    @media screen and (max-width: 600px) {
      .middle-btn {
        top: 21%;
        left: 43%;
        width: 50%;
        height: 8%;
      }
      .bottom-btn {
        bottom: 5%;
        left: 25%;
        width: 55%;
        height: 10%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 이미지 -->
    <img src="홈페이지메인.jpg" alt="정보공유방 메인" class="main-image">

    <!-- 중간 링크 -->
    <a href="http://sk10044.com" class="link-btn middle-btn" target="_blank"></a>

    <!-- 하단 링크 -->
    <a href="http://sk10044.com" class="link-btn bottom-btn" target="_blank"></a>
  </div>
</body>
</html>
